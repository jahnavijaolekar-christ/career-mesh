<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply - {{ job.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
    <div class="logo">💼 Career<span>Mesh</span></div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
    </div>
</nav>
<div class="container form-container">
    <h2>Apply for: <span class="highlight">{{ job.title }}</span></h2>
    <p class="company">🏢 {{ job.company }} &nbsp;|&nbsp; 📍 {{ job.location }}</p>
    <form method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Enter your phone number" required>
        </div>
        <div class="form-group">
            <label>Years of Experience</label>
            <select name="experience">
                <option value="0-1">0–1 years (Fresher)</option>
                <option value="1-3">1–3 years</option>
                <option value="3-5">3–5 years</option>
                <option value="5+">5+ years</option>
            </select>
        </div>
        <div class="form-group">
            <label>Cover Letter</label>
            <textarea name="cover_letter" rows="5" placeholder="Tell us why you're a great fit..."></textarea>
        </div>
        <div class="form-group">
            <label>Resume <span style="color:#888; font-weight:400">(Paste your resume content below)</span></label>
            <textarea 
                name="resume_text" 
                rows="12" 
                placeholder="Paste your resume content here — include your skills, experience, education, and achievements..."
                style="font-family: monospace; font-size: 13px; line-height: 1.6;"
                required>
            </textarea>
            <small style="color:#888; display:block; margin-top:6px;">
                💡 Tip: Copy all text from your resume and paste it here for best ATS matching results.
            </small>
        </div>
        <button type="submit" class="btn-submit">Submit Application</button>
        <a href="/" class="btn-back">← Back to Jobs</a>
    </form>
</div>
</body>
</html>
