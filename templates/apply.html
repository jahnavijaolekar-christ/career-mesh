<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply - {{ job.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="logo">💼 Career<span>Mesh</span></div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
    </div>
</nav>

<div class="container form-container">
    <h2>Apply for: <span class="highlight">{{ job.title }}</span></h2>
    <p class="company">🏢 {{ job.company }} &nbsp;|&nbsp; 📍 {{ job.location }}</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Enter your phone number" required>
        </div>
        <div class="form-group">
            <label>Years of Experience</label>
            <select name="experience">
                <option value="0-1">0–1 years (Fresher)</option>
                <option value="1-3">1–3 years</option>
                <option value="3-5">3–5 years</option>
                <option value="5+">5+ years</option>
            </select>
        </div>
        <div class="form-group">
            <label>Cover Letter</label>
            <textarea name="cover_letter" rows="5" placeholder="Tell us why you're a great fit..."></textarea>
        </div>
        <div class="form-group">
            <label>Upload Resume <span style="color:#888; font-weight:400">(PDF, DOC, DOCX — Max 5MB)</span></label>
            <div class="file-upload-wrapper">
                <input type="file" id="resume-file" name="resume"
                       accept=".pdf,.doc,.docx" onchange="updateFileName(this)">
                <div class="file-upload-box" onclick="document.getElementById('resume-file').click()">
                    <span class="upload-icon">📄</span>
                    <span id="file-label">Click to upload your resume</span>
                    <span class="file-hint">PDF, DOC or DOCX</span>
                </div>
            </div>
        </div>
        <button type="submit" class="btn-submit">Submit Application</button>
        <a href="/" class="btn-back">← Back to Jobs</a>
    </form>
</div>
<script>
function updateFileName(input) {
    const label = document.getElementById('file-label');
    const box   = document.querySelector('.file-upload-box');
    if (input.files && input.files[0]) {
        const file = input.files[0];
        if (file.size > 5 * 1024 * 1024) {
            alert('File size exceeds 5MB. Please upload a smaller file.');
            input.value = '';
            return;
        }
        label.textContent = '✅ ' + file.name;
        box.classList.add('file-selected');
    }
}
</script>

</body>
</html>
